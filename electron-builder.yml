appId: io.github.cubecrashers
productName: Cube Crashers
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - electron/**
  - package.json
mac:
  category: public.app-category.games
  target:
    - target: dmg
      arch: [arm64, x64]
  # unsigned for now; set an identity and notarize later
  identity: null
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
