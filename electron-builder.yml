appId: io.github.cubecrashers
productName: Cube Crashers
copyright: "© 2026 Dominik Amann, amannlabs.eu"
# no spaces in file names: GitHub would rename them and the auto-updater would not find them
artifactName: CubeCrashers-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - electron/**
  - package.json
# the auto-updater reads releases from here (public repository, no token needed to read)
publish:
  provider: github
  owner: dominikamann
  repo: cube-crashers
mac:
  category: public.app-category.games
  target:
    # zip is what the macOS auto-updater downloads; dmg is for people installing by hand
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
